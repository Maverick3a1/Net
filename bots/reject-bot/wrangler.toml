name = "reject-bot"
main = "src/worker.js"
compatibility_date = "2025-10-01"

# Create it with: npx wrangler kv namespace create QUEUE  (then paste the id here)
[[kv_namespaces]]
binding = "QUEUE"
id = "afeabae80b2e4c1e999ff5eb241070ce"

[vars]
GITHUB_REPO = "Maverick3a1/Net"
GITHUB_BRANCH = "main"
# The "Reject 待办判断" routine; the Worker fires it through its API trigger on each message.
CLAUDE_ROUTINE_ID = "trig_015eZU6NkN8XakECnAymSpWc"
# Fallback run for messages whose fire failed. Shown in replies; keep it in sync with the routine.
JUDGE_SCHEDULE = "每天 23:00（北京时间）"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   TELEGRAM_TOKEN     bot token from @BotFather
#   TELEGRAM_USER_ID   your numeric Telegram user id; everyone else is ignored
#   WEBHOOK_SECRET     random string; Telegram sends it back on every webhook call
#   ROUTINE_TOKEN      random string; the Claude routine sends it as a Bearer token
#   GITHUB_TOKEN       fine-grained token, only Maverick3a1/Net, Contents: Read and write
#   CLAUDE_ROUTINE_TOKEN  the routine's API trigger token (claude.ai/code/routines → Edit →
#                         Trigger → API → Generate token)
